<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Caja Rápido</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000000; color: #ffffff; text-align: center; padding: 12px; margin: 0; user-select: none; }
        h2 { margin: 10px 0 5px 0; font-size: 20px; color: #00ffb3; text-transform: uppercase; letter-spacing: 1px; }
        
        /* PANEL DE TOTAL GENERAL */
        #panel-total-general { background: #121212; border: 2px solid #00ffb3; border-radius: 12px; padding: 15px; margin: 10px 0; }
        #panel-total-general div { font-size: 14px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
        #total-general { font-size: 36px; font-weight: 900; color: #00ffb3; margin-top: 5px; }
        
        #indicador-modo { background: #1a1a1a; padding: 6px; font-size: 12px; font-weight: bold; color: #00ffb3; border-radius: 6px; margin-bottom: 5px; text-transform: uppercase; transition: all 0.2s; }
        .modo-resta-alerta { color: #ff453a !important; background: #2d1111 !important; border: 1px solid #ff453a; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; padding-bottom: 10px; }
        .card { background: #121212; border-radius: 12px; padding: 10px; border: 1px solid #222; display: flex; flex-direction: column; justify-content: space-between; height: 110px; box-sizing: border-box; }
        .info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .name { font-size: 16px; font-weight: bold; color: #ffffff; text-align: left; }
        .clics { font-size: 11px; color: #888; background: #222; padding: 2px 6px; border-radius: 20px; }
        .total { font-size: 22px; font-weight: 800; color: #00ffb3; margin: 2px 0 6px 0; text-align: left; }
        .btn { background: #1e1e1e; color: #ffffff; border: 1px solid #333; padding: 10px; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; transition: background 0.1s; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: #00ffb3; color: #000; border-color: #00ffb3; }
        
        .card-resta .btn { border-color: #ff453a; }
        .card-resta .btn:active { background: #ff453a !important; color: #fff !important; border-color: #ff453a !important; }
        
        #panel-historial { margin-top: 15px; background: #121212; border-top: 2px solid #222; padding: 12px; text-align: left; border-radius: 12px 12px 0 0; }
        .header-hist { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
        #panel-historial h4 { margin: 0; color: #00ffb3; font-size: 13px; text-transform: uppercase; flex-grow: 1; }
        .action-btn { color: white; border: none; padding: 6px 10px; font-size: 11px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .restar-mode-btn { background: #ff453a; }
        .clear-btn { background: #333; color: #aaa; }
        #log { max-height: 180px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #aaa; line-height: 1.5; }
    </style>
</head>
<body>

    <h2>Registro de Ventas</h2>
    
    <div id="panel-total-general">
        <div>Total Caja General</div>
        <div id="total-general">$0</div>
    </div>

    <div id="indicador-modo">Modo Actual: Sumando Producto</div>
    
    <div class="grid" id="contenedor-grid">
        <!-- 1. t -->
        <div class="card">
            <div class="info"><span class="name">t</span><span id="cli-t" class="clics">0</span></div>
            <div class="total" id="tot-t">$0</div>
            <button class="btn" id="btn-t" onclick="procesar('t', 't', 107)">+107</button>
        </div>
        <!-- 2. e-m -->
        <div class="card">
            <div class="info"><span class="name">e-m</span><span id="cli-em" class="clics">0</span></div>
            <div class="total" id="tot-em">$0</div>
            <button class="btn" id="btn-em" onclick="procesar('em', 'e-m', 117)">+117</button>
        </div>
        <!-- 3. p-ps -->
        <div class="card">
            <div class="info"><span class="name">p-ps</span><span id="cli-pps" class="clics">0</span></div>
            <div class="total" id="tot-pps">$0</div>
            <button class="btn" id="btn-pps" onclick="procesar('pps', 'p-ps', 122)">+122</button>
        </div>
        <!-- 4. s -->
        <div class="card">
            <div class="info"><span class="name">s</span><span id="cli-s" class="clics">0</span></div>
            <div class="total" id="tot-s">$0</div>
            <button class="btn" id="btn-s" onclick="procesar('s', 's', 36)">+36</button>
        </div>
        <!-- 5. bt -->
        <div class="card">
            <div class="info"><span class="name">bt</span><span id="cli-bt" class="clics">0</span></div>
            <div class="total" id="tot-bt">$0</div>
            <button class="btn" id="btn-bt" onclick="procesar('bt', 'bt', 29)">+29</button>
        </div>
        <!-- 6. t2 -->
        <div class="card">
            <div class="info"><span class="name">t2</span><span id="cli-t2" class="clics">0</span></div>
            <div class="total" id="tot-t2">$0</div>
            <button class="btn" id="btn-t2" onclick="procesar('t2', 't2', 120)">+120</button>
        </div>
        <!-- 7. t3 -->
        <div class="card">
            <div class="info"><span class="name">t3</span><span id="cli-t3" class="clics">0</span></div>
            <div class="total" id="tot-t3">$0</div>
            <button class="btn" id="btn-t3" onclick="procesar('t3', 't3', 132)">+132</button>
        </div>
        <!-- 8. j -->
        <div class="card">
            <div class="info"><span class="name">j</span><span id="cli-j" class="clics">0</span></div>
            <div class="total" id="tot-j">$0</div>
            <button class="btn" id="btn-j" onclick="procesar('j', 'j', 93)">+93</button>
        </div>
        <!-- 9. ag -->
        <div class="card">
            <div class="info"><span class="name">ag</span><span id="cli-ag" class="clics">0</span></div>
            <div class="total" id="tot-ag">$0</div>
            <button class="btn" id="btn-ag" onclick="procesar('ag', 'ag', 98)">+98</button>
        </div>
        <!-- 10. jm -->
        <div class="card">
            <div class="info"><span class="name">jm</span><span id="cli-jm" class="clics">0</span></div>
            <div class="total" id="tot-jm">$0</div>
            <button class="btn" id="btn-jm" onclick="procesar('jm', 'jm', 30)">+30</button>
        </div>
        <!-- 11. 1p -->
        <div class="card">
            <div class="info"><span class="name">1p</span><span id="cli-1p" class="clics">0</span></div>
            <div class="total" id="tot-1p">$0</div>
            <button class="btn" id="btn-1p" onclick="procesar('1p', '1p', 65)">+65</button>
        </div>
        <!-- 12. 1/2p -->
        <div class="card">
            <div class="info"><span class="name">1/2p</span><span id="cli-2p" class="clics">0</span></div>
            <div class="total" id="tot-2p">$0</div>
            <button class="btn" id="btn-2p" onclick="procesar('2p', '1/2p', 45)">+45</button>
        </div>
        <!-- 13. br -->
        <div class="card">
            <div class="info"><span class="name">br</span><span id="cli-br" class="clics">0</span></div>
            <div class="total" id="tot-br">$0</div>
            <button class="btn" id="btn-br" onclick="procesar('br', 'br', 171)">+171</button>
        </div>
    </div>

    <div id="panel-historial">
        <div class="header-hist">
            <h4>Historial</h4>
            <button class="action-btn restar-mode-btn" id="toggle-resta" onclick="alternarModoResta()">¿Error? Restar</button>
            <button class="action-btn clear-btn" onclick="borrarHistorial()">Reset</button>
        </div>
        <div id="log"></div>
    </div>

    <script>
        let modoSuma = true;
        
        const BD_INICIAL = {
            t: { clics: 0, total: 0 }, em: { clics: 0, total: 0 }, pps: { clics: 0, total: 0 },
            s: { clics: 0, total: 0 }, bt: { clics: 0, total: 0 }, t2: { clics: 0, total: 0 },
            t3: { clics: 0, total: 0 }, j: { clics: 0, total: 0 }, ag: { clics: 0, total: 0 },
            jm: { clics: 0, total: 0 }, "1p": { clics: 0, total: 0 }, "2p": { clics: 0, total: 0 },
            br: { clics: 0, total: 0 }
        };

        let BD;
        let historialLogs;

        // SISTEMA ANTIFALLOS: Detecta memoria vieja corrompida y la limpia en el acto
        try {
            const copiaLocal = localStorage.getItem('caja_rapida');
            const logsLocales = localStorage.getItem('caja_rapida_logs');
            
            BD = copiaLocal ? JSON.parse(copiaLocal) : JSON.parse(JSON.stringify(BD_INICIAL));
            historialLogs = logsLocales ? JSON.parse(logsLocales) : [];
            
            // Verifica que la memoria contenga las llaves necesarias, si no, fuerza el reinicio
            if (BD && !BD.t) { 
                throw new Error("Estructura antigua detectada"); 
            }
        } catch (e) {
            localStorage.clear();
            BD = JSON.parse(JSON.stringify(BD_INICIAL));
            historialLogs = [];
        }

        // Mostrar datos en pantalla al cargar
        actualizarPantalla();

        function procesar(id, nombre, valor) {
            if (modoSuma) {
                BD[id].clics += 1;
                BD[id].total += valor;
                agregarLog(`+ $${valor} a ${nombre}`);
            } else {
                if (BD[id].clics > 0 && BD[id].total >= valor) {
                    BD[id].clics -= 1;
                    BD[id].total -= valor;
                    agregarLog(`- $${valor} a ${nombre} (Corrección)`);
                } else {
